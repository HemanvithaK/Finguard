name: FinGuard CI — Model Quality & Data Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy faker lightgbm scikit-learn joblib pytest

      - name: Create data directories
        run: mkdir -p data/raw data/processed data/golden

      - name: Generate synthetic dataset
        working-directory: src/data_gen
        run: python build_dataset.py

      - name: Generate golden test set
        run: python src/evals/create_golden_set.py

      - name: Run model quality tests
        run: python -m pytest tests/test_model_quality.py -v --tb=short

      - name: Run eval suite
        run: python src/evals/eval_models.py